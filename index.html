<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <title>Bunyan — روابط قانونية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        :root {
          color-scheme: light dark;
          --ink: light-dark(#1c1b16, #edeae2);
          --muted: light-dark(#6e6b60, #a5a296);
          --surface-sunken: light-dark(#faf8f4, #17160f);
          --accent: light-dark(#106b58, #3fae8f);
        }
        body {
          font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background: var(--surface-sunken);
          max-width: 480px;
          margin: 4rem auto;
          padding: 0 1.5rem;
          line-height: 1.7;
          text-align: center;
        }
        h1 { font-size: 1.2rem; }
        p { color: var(--muted); font-size: 0.9rem; }
        a {
          display: block; margin: 0.75rem 0;
          color: var(--accent); font-weight: 650; text-decoration: none;
          font-size: 0.95rem;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Bunyan</h1>
    <p>روابط الشروط والأحكام وسياسة الخصوصية / Legal links</p>
    <a href="legal/terms.html">الشروط والأحكام — Terms of Service</a>
    <a href="legal/privacy.html">سياسة الخصوصية — Privacy Policy</a>
</body>
</html>
